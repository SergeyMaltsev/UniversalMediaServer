# UMS specific project properties
project.name=${project.name}
project.version=${project.version}
project.renderers.dir=renderers, src/main/external-resources/renderers
project.binaries.dir=
project.binaries.revision=${binary-revision}
project.logback=[PROFILE_DIR]/logback.xml, logback.xml, src/main/external-resources/logback.xml
project.logback.headless=[PROFILE_DIR]/logback.headless.xml, logback.headless.xml, src/main/external-resources/logback.headless.xml
project.skelprofile.dir=/etc/skel/.config

# Git commit information from the git-commit-id-plugin
git.commit.id=${git.commit.id}
git.commit.time=${git.commit.time}
# <custom:release> Release number of the custom edition (e.g. 15.9.0-custom.1), passed by build\release.ps1 (-Dcustom.version)
project.custom.version=${custom.version}
# </custom:release>
